name: Sync Profile Stats

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cli-release]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}

      - name: Fetch stats from mindlore repo
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          PLUGIN=$(gh api repos/mindlore/mindlore/contents/plugin.json --jq '.content' | base64 -d)
          HOOKS=$(echo "$PLUGIN" | jq '.hooks | length')
          SKILLS=$(echo "$PLUGIN" | jq '.skills | length')

          echo "HOOKS=$HOOKS SKILLS=$SKILLS"

          sed -i "s/[0-9]* hooks/$HOOKS hooks/" profile/README.md
          sed -i "s/[0-9]* skills/$SKILLS skills/" profile/README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add profile/README.md && git commit -m "chore: sync profile stats" && git push)
